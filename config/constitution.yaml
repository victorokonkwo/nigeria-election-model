# ── Constitutional Rules for Presidential Election ───
# Source: 1999 Constitution of the Federal Republic of Nigeria (as amended)
# Section 134 — Election of President

# ── Geographic units ─────────────────────────
n_states: 36
fct: true                       # FCT Abuja counts as a unit
total_units: 37                  # 36 states + FCT
units:
