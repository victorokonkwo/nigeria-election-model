# ── Global Configuration ─────────────────────
# All paths are relative to the project root.

project_name: ngforecast
version: "0.1.0"

# ── Election target ──────────────────────────
election_date: "2027-02-27"
election_type: presidential

# ── Paths ────────────────────────────────────
paths:
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  outputs: outputs
  models: outputs/models
  forecasts: outputs/forecasts
  figures: outputs/figures

# ── Simulation ───────────────────────────────
n_sims: 20000
seed: 2027

# ── Historical elections used for training ───
training_elections:
  - 1999
  - 2003
  - 2007
  - 2011
  - 2015
  - 2019
  - 2023

# ── Election dates (presidential) ───────────
# Covariates are measured strictly before these dates (no look-ahead).
election_dates:
  1999: "1999-02-27"
  2003: "2003-04-19"
  2007: "2007-04-21"
  2011: "2011-04-16"
  2015: "2015-03-28"
  2019: "2019-02-23"
  2023: "2023-02-25"
  2027: "2027-02-27"

# ── Logging ──────────────────────────────────
log_level: INFO
log_file: logs/ngforecast.log
